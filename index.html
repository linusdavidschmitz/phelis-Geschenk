<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ein Geschenk für dich 🎁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #b2e0d8 0%, #e8d5c4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 4px; height: 4px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.4); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    .envelope {
      font-size: 64px;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9a7b6a;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      color: #2d6e61;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: #c4a882;
      margin: 20px auto;
    }

    .message {
      font-size: 15px;
      color: #5a5a5a;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #2d6e61;
      color: white;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(45,110,97,0.35);
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45,110,97,0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #b0968a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="card">
    <span class="envelope">🎁</span>
    <p class="subtitle">Ein Geschenk für dich</p>
    <h1>Alles Liebe zum Geburtstag, Opsi</h1>
    <div class="divider"></div>
    <p class="message">
      Hier wartet etwas Besonderes auf dich.<br>
      Klick, um dein Geschenk zu öffnen ♡
    </p>
    <a class="btn" href="Opsi-Paris-Gutschein.pdf" target="_blank">
      Geschenk öffnen ✨
    </a>
    <p class="footer">nur für dich · mit viel Liebe</p>
  </div>

  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      s.style.animationDuration = (2 + Math.random() * 2) + 's';
      container.appendChild(s);
    }
  </script>
</body>
</html>
